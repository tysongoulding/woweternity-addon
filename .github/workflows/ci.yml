name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-addon:
    name: Addon Syntax & Simulation Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 & BitOp compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-bitop

      - name: Lua Syntax Check (luac)
        run: |
          luac5.1 -p "WoWEternityAddon.lua"

      - name: Validate TOC Metadata
        run: |
          grep -E "## Interface:\s*11506" "WoW Eternity Addon.toc"
          grep -E "## Title:\s*WoW Eternity Addon" "WoW Eternity Addon.toc"
          grep -E "## SavedVariables:\s*WoWEternityAddonDB" "WoW Eternity Addon.toc"
          grep -E "WoWEternityAddon\.lua" "WoW Eternity Addon.toc"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Simulation & Adversarial Verification Gates
        run: |
          node tests/addon_simulation_test.js
          node tests/m4_adversarial_challenge.mjs
